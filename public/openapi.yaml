  /api/v1/workspaces/{workspace_id}/reference-options:
    get:
      description: |
        Returns grouped, permission-filtered candidates for Assign editor mentions and references. Matching uses prefixes and words from active member display names, active Workspace Agent names, unarchived Document titles, Project names and keys, and Task titles and ticket references. Each requested type has its own limit. Results have no cursor or total. A blank query returns empty groups.

        Requires bearer read scope and current Workspace and resource access, including for a blank query. Send no request body, unknown query fields, conditional headers or Idempotency-Key. Labels are complete within each group. Responses use private, no-store and negotiate identity or gzip JSON; they carry no resource validator.
      operationId: listWorkspaceReferenceOptions
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - description: Typeahead text. Leading and trailing whitespace is ignored; blank text returns no candidates.
          in: query
          name: q
          required: true
          schema:
            maxLength: 100
            minLength: 0
            type: string
        - description: Repeat to restrict result groups. Repeated values are deduplicated; omitting it queries all five types. The complete query is limited to 16384 encoded bytes and 1000 fields.
          explode: true
          in: query
          name: types
          required: false
          schema:
            items:
              $ref: "#/components/schemas/ReferenceOptionType"
            maxItems: 999
            minItems: 1
            type: array
          style: form
        - description: Maximum candidates returned for each requested type. Defaults to 10.
          in: query
          name: limit
          required: false
          schema:
            default: 10
            maximum: 20
            minimum: 1
            type: integer
        - description: Comment (default) requires Agent Task-comment capability. Discuss includes ready installed Agents and active custom Agents without that capability; entitlement and Project or binding visibility still apply. Selection never grants execution authority.
          in: query
          name: surface
          required: false
          schema:
            default: comment
            enum:
              - comment
              - discuss
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceOptionList"
          description: Grouped, bounded candidates that the caller may reference.
          headers:
            Cache-Control:
              schema:
                const: private, no-store
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/ProductProblem"
        "413":
          $ref: "#/components/responses/ProductProblem"
        "415":
          $ref: "#/components/responses/ProductProblem"
        "422":
          $ref: "#/components/responses/ProductProblem"
        "429":
          $ref: "#/components/responses/ProductProblem"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/MaintenanceUnavailable"
        default:
          $ref: "#/components/responses/ProductProblem"
      security:
        - bearerToken: []
      summary: Query bounded editor reference and mention candidates
      tags:
        - Documents
  /api/v1/workspaces/{workspace_id}/search:
    get:
      description: |
        Returns a bounded, cursor-paginated page of authorized Project, Task,
        Document, Comment, or active Person matches from exactly one Workspace. Exact
        identifiers and titles take precedence, followed by title prefixes,
        weighted lexical relevance, typo tolerance, and recency. The opaque
        cursor preserves that deterministic ordering. Plain-text snippets are
        bounded and stripped of control characters; results never expose a raw
        engine score or exact total. Archived resources are excluded unless
        explicitly included; trashed, purged, and deleted resources remain excluded.
        Work is rate-limited and query-time bounded; overload returns a
        retryable `503 search_unavailable` with `Retry-After`.
        The page uses data, next_cursor and has_more. Follow every non-null cursor
        with the same normalized query, filters and page size. Cursors are confidential
        and bound to the current credential, membership, projection, contract epochs
        and Workspace visibility/content checkpoint. A changed source or checkpoint,
        expired cursor, or cursor from another query returns 400 invalid_cursor;
        restart from the first page. Old signed cursors cannot resume this contract.
        Only JSON with identity or gzip encoding is supported. Media/encoding refusal
        precedes Search data reads. Responses use no-store and vary by Accept and
        Accept-Encoding. Complete logical and encoded bodies retain the shared finite
        response limit; oversized pages fail without partial results or a cursor.
      operationId: searchWorkspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - description: Terms or quoted phrases. Leading and trailing whitespace is ignored.
          in: query
          name: q
          required: true
          schema:
            maxLength: 200
            minLength: 2
            type: string
        - description: Restrict matches to this Project. An inaccessible Project produces no results rather than confirming it exists.
          in: query
          name: project_id
          required: false
          schema:
            $ref: "#/components/schemas/Identifier"
        - description: Restrict matches to one indexed resource type.
          in: query
          name: resource_type
          required: false
          schema:
            $ref: "#/components/schemas/SearchResourceType"
        - description: Include archived resources. Resolved Tasks are included regardless because resolution is not archival.
          in: query
          name: include_archived
          required: false
          schema:
            default: false
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - in: query
          name: limit
          required: false
          schema:
            default: 20
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultList"
          description: A page of authorized Workspace content matches.
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
            Content-Encoding:
              description: Present when the complete body uses gzip.
              schema:
                const: gzip
                type: string
            Content-Length:
              description: Exact negotiated complete-body length in encoded bytes. No partial results or continuation are published after response construction failure.
              schema:
                maximum: 12648448
                minimum: 1
                type: integer
            Vary:
              description: Includes Accept and Accept-Encoding.
              schema:
                type: string
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/ProductProblem"
        "413":
          $ref: "#/components/responses/ProductProblem"
        "422":
          $ref: "#/components/responses/ProductProblem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/MaintenanceUnavailable"
        default:
          $ref: "#/components/responses/ProductProblem"
      security:
        - bearerToken: []
      summary: Search Workspace content
      tags:
        - Search
  /api/v1/workspaces/{workspace_id}/tasks:
    get:
      description: Read authorized Task metadata from the canonical Workspace collection. Use project_id for one Project, code for exact Task-code resolution, or subscribed for the caller’s followed Tasks. Task codes normalize to uppercase ASCII; invisible or absent matches return an empty page. Existing status, lifecycle, assignee, Milestone, due, history and ordering filters retain their declared semantics. Default limit 50, maximum 100. Short or empty pages can still have next_cursor. Follow that opaque cursor without changing filters or credentials. Responses include bounded page-scoped display references and explicit coverage; descriptions, history, summaries and commands are excluded. Decimal identifiers and revisions must retain their exact string representation. Current source and resource authority precede conditional responses. Collection validators cannot authorize item writes. Identity and decoded gzip representations are bounded to 262144 bytes. Unsupported bodies, duplicate scalar keys, unknown query keys and request coding are rejected.
      operationId: listWorkspaceTasks
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - description: Opaque continuation cursor returned by the preceding page.
          in: query
          name: cursor
          required: false
          schema:
            $ref: "#/components/schemas/Cursor"
        - description: Maximum number of resources to return.
          in: query
          name: limit
          required: false
          schema:
            default: 50
            maximum: 100
            minimum: 1
            type: integer
        - description: OR within declared repeated Project identifiers; AND with other filters. Every Project is authorized before selection.
          explode: true
          in: query
          name: project_id
          required: false
          schema:
            items:
              $ref: "#/components/schemas/Identifier"
            maxItems: 100
            minItems: 1
            type: array
            uniqueItems: true
          style: form
        - description: Restrict to one or more Status lifecycle categories.
          explode: true
          in: query
          name: status_category
          schema:
            items:
              $ref: "#/components/schemas/StatusCategory"
            maxItems: 5
            minItems: 1
            type: array
            uniqueItems: true
          style: form
        - description: |
            Keep Tasks whose current stage has every named lifecycle behavior
            enabled (AND semantics, at most 8 distinct keys). Keys are the
            Task-applicable entries of `listLifecycleBehaviors`; an unknown or
            non-Task key is a 400. Totals and cursors honor the filter.
          explode: true
          in: query
          name: behavior
          schema:
            items:
              $ref: "#/components/schemas/LifecycleBehaviorKey"
            maxItems: 8
            minItems: 1
            type: array
            uniqueItems: true
          style: form
        - in: query
          name: assignee_actor_id
          schema:
            $ref: "#/components/schemas/Identifier"
        - description: OR within declared repeated Milestone identifiers; preserve single-Project history/column restrictions.
          explode: true
          in: query
          name: milestone_id
          required: false
          schema:
            items:
              $ref: "#/components/schemas/Identifier"
            maxItems: 100
            minItems: 1
            type: array
            uniqueItems: true
          style: form
        - description: Include Tasks updated at or after this instant.
          in: query
          name: updated_since
          schema:
            $ref: "#/components/schemas/Timestamp"
        - description: Include archived Tasks; omitted or false returns active Tasks only.
          in: query
          name: include_archived
          schema:
            default: false
            type: boolean
        - description: Opt into service-derived coverage and version-bound pagination.
          in: query
          name: consistency
          schema:
            enum:
              - checked
            type: string
        - description: Active means unresolved; omitted or all includes active and resolved Tasks.
          in: query
          name: state
          schema:
            default: all
            enum:
              - active
              - resolved
              - all
            type: string
        - description: Restrict to completed or cancelled resolution. Incompatible with active state.
          in: query
          name: resolution
          schema:
            enum:
              - completed
              - cancelled
            type: string
        - explode: true
          in: query
          name: status_id
          schema:
            items:
              $ref: "#/components/schemas/Identifier"
            maxItems: 100
            minItems: 1
            type: array
            uniqueItems: true
          style: form
        - description: Column rank order or newest resolution first; number retains history semantics. Workspace number order is the default. Activity orders retain updated_at/ID; priority_updated_at requires checked consistency.
          in: query
          name: order
          schema:
            default: number
            enum:
              - number
              - rank
              - rank_desc
              - resolved_desc
              - updated_at
              - priority_updated_at
            type: string
        - description: Inclusive recent-resolution cutoff for column orders; does not restrict column.total.
          in: query
          name: resolved_since
          schema:
            format: date-time
            type: string
        - description: Start strictly after this current Task in the chosen rank direction. Must belong to this Project and Status. Cannot accompany cursor or resolved_desc. Other history filters are not accepted with column orders.
          in: query
          name: anchor_task_id
          schema:
            $ref: "#/components/schemas/Identifier"
        - description: Filter the current effective human actor's subscriptions; no caller-selected subscriber authority.
          in: query
          name: subscribed
          required: false
          schema:
            type: boolean
        - description: Exact case-insensitive Task code normalized to uppercase, never substring/fuzzy matching. Zero matches is an empty authorized page; use immutable ID for complete detail.
          in: query
          name: code
          required: false
          schema:
            maxLength: 28
            minLength: 4
            pattern: ^[A-Za-z][A-Za-z0-9]{1,7}-[1-9][0-9]{0,18}$
            type: string
        - in: query
          name: due_on
          required: false
          schema:
            format: date
            type: string
        - in: query
          name: assignee_actor_ids
          required: false
          schema:
            items:
              $ref: "#/components/schemas/Identifier"
            maxItems: 100
            minItems: 1
            type: array
            uniqueItems: true
        - description: Opaque current representation validator. Current authority is checked before bodyless304.
          in: header
          name: If-None-Match
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalTaskPage"
          description: A bounded canonical Workspace Task row page; Project/subscribed/exact-code filters share one operation.
          headers:
            Assign-Next-Cursor:
              description: Opaque continuation also supplied in next_cursor.
              schema:
                maxLength: 4096
                type: string
            Cache-Control:
              schema:
                type: string
            Content-Encoding:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Vary:
              schema:
                type: string
        "304":
          description: Authorized current representation is unchanged; no body.
          headers:
            Assign-Next-Cursor:
              description: Opaque continuation also supplied in next_cursor.
              schema:
                maxLength: 4096
                type: string
            Cache-Control:
              schema:
                type: string
            Content-Encoding:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Vary:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Unknown/duplicate/invalid selector, unsupported combination, malformed or incompatible cursor
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Current authorization, source visibility, conflict, dependency or admission failure
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Current authorization, source visibility, conflict, dependency or admission failure
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Current authorization, source visibility, conflict, dependency or admission failure
        "406":
          $ref: "#/components/responses/ProductProblem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Current authorization, source visibility, conflict, dependency or admission failure
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Expired cursor or immutable capability; restart explicitly
        "412":
          $ref: "#/components/responses/ProductProblem"
        "413":
          $ref: "#/components/responses/ProductProblem"
        "415":
          $ref: "#/components/responses/ProductProblem"
        "422":
          $ref: "#/components/responses/ProductProblem"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Current authorization, source visibility, conflict, dependency or admission failure
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Current authorization, source visibility, conflict, dependency or admission failure
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Current authorization, source visibility, conflict, dependency or admission failure
      security:
        - bearerToken: []
      summary: A bounded canonical Workspace Task row page; Project/subscribed/exact-code filters share one operation.
      tags:
        - Tasks
