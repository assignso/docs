            $ref: "#/components/schemas/Cursor"
        - description: Maximum number of resources to return.
          in: query
          name: limit
          required: false
          schema:
            default: 50
            maximum: 100
            minimum: 1
            type: integer
        - description: Exact Workspace Project key. A selector never grants authority.
          in: query
          name: code
          required: false
          schema:
            maxLength: 8
            minLength: 2
            pattern: ^[A-Za-z][A-Za-z0-9]{1,7}$
            type: string
        - description: Include archived Projects; false selects active rows only.
          in: query
