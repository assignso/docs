          description: Set by the first successful edit. Public, so readers can see the text changed.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        id:
          $ref: "#/components/schemas/Identifier"
        number:
          description: Creation-order ordinal within this Task, including deletion tombstones; use for numbered Comment links.
          format: int64
          minimum: 1
          type: integer
        reactions:
          description: Non-zero reaction aggregates in the fixed catalog order.
          items:
            $ref: "#/components/schemas/CommentReactionSummary"
          maxItems: 6
          type: array
        revision:
          minimum: 1
          type: integer
        task_id:
          $ref: "#/components/schemas/Identifier"
