  /api/v1/workspaces/{workspace_id}/projects:
    get:
      description: Read an authorized Workspace Project page, or resolve an exact Workspace Project key with code. Project keys normalize to uppercase ASCII. Invisible or missing matches return an empty page. Default limit 50, maximum 100. Pages may be short or empty while still providing next_cursor; continue until next_cursor is null. Results include complete Project metadata, permissions, lifecycle references and Task totals. Revisions, Task numbers and totals are decimal strings. Cursors are opaque and bound to the credential, filters and current visibility; restart after authority changes or expiry. Current authorization precedes conditional responses. Collection validators cannot authorize item writes. Identity and decoded gzip representations are bounded to 262144 bytes. Read bodies, duplicate scalar keys, unknown query keys and unsupported request coding are rejected.
