    CanonicalProjectProjectKey:
      description: |
        Uppercase-normalized ticket prefix used to form human-readable Task
        references (for example `ASSIGN-42`). Unique per Workspace and
        immutable after creation; not a substitute for the opaque `id`.
      examples:
        - ASSIGN
      pattern: ^[A-Z][A-Z0-9]{1,7}$
      type: string
    CanonicalProjectProjectPermissions:
      additionalProperties: false
      properties:
        can_manage_members:
          type: boolean
        can_publish:
          type: boolean
        can_update:
          type: boolean
      required:
        - can_update
        - can_publish
        - can_manage_members
      type: object
    CanonicalProjectProjectVisibility:
      description: Private Projects require explicit Project membership except for governed Workspace owner/admin access. Public affects only the sanitized anonymous projection; authenticated access remains policy-checked.
      enum:
        - workspace
        - private
        - public
      type: string
    CanonicalProjectProjectVisualIdentity:
      description: A single allowlisted Lucide icon name or fully-qualified Unicode Emoji 17.0 sequence.
      oneOf:
        - $ref: "#/components/schemas/CanonicalProjectProjectIconVisualIdentity"
        - $ref: "#/components/schemas/CanonicalProjectProjectEmojiVisualIdentity"
    CanonicalProjectResolvedLifecycle:
      additionalProperties: false
      description: |
