              const: 409
            type:
              const: https://docs.assign.so/errors/idempotency_key_conflict
          type: object
    Identifier:
      description: Opaque Assign-owned UUIDv7 identifier. Clients must not derive meaning from it.
      examples:
        - 0198ac5e-f9b7-7000-8000-000000000001
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      type: string
    InterfaceLanguageState:
      additionalProperties: false
      description: |
        Resolved presentation language. The desired Account preference takes precedence. Automatic matches ordered device languages through supported aliases, then falls back to English. Unavailable stored preferences are retained and resolve to English.
      properties:
        availability_revision:
          maxLength: 100
          type: string
        direction:
          enum:
            - ltr
            - rtl
          type: string
        hint_revision:
          format: int64
          minimum: 1
          type: integer
        language:
          maxLength: 35
          minLength: 2
          type: string
        reason:
          enum:
            - language_unavailable
            - no_supported_device_language
          type: string
        source:
          enum:
            - account
            - device
            - fallback
          type: string
        supported_languages:
          items:
            maxLength: 35
            minLength: 2
            type: string
          maxItems: 100
          type: array
      required:
        - language
        - source
        - direction
        - availability_revision
        - hint_revision
        - supported_languages
      type: object
