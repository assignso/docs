components:
  headers:
    AssignAPIVersion:
      description: Assign-API-Version diagnostic, never authorization or an old-contract selector.
      schema:
        minLength: 1
        type: string
    AssignDeadlineMs:
      description: Effective remaining Core request budget at admission in milliseconds, bounded by any inherited context deadline. Diagnostic only; client-supplied values do not extend work. Cancellation is cooperative and bounds context-aware work. A timeout or disconnect does not prove that a committed mutation rolled back; recover using the operation's retained idempotency key/receipt before issuing another mutation. Committed responses are preserved.
      schema:
        pattern: ^[0-9]+$
        type: string
    AssignLimit:
      description: Assign application limit metadata version 1, independent of draft IETF RateLimit fields. The closed kind/scope/policy/unit labels identify the applicable existing budget, never a bucket, credential, actor identifier or private queue depth. The search class is query cost (one admitted query unit), not paid entitlement. cost is the units required by this request; limit/remaining are window units when known; reset is Unix seconds. Concurrent and entitlement outcomes omit unknown counters. A reset or Retry-After is earliest retry guidance, not guaranteed admission. Honor Retry-After within the caller deadline, use bounded backoff with jitter and do not loop automatically on quota/entitlement failures.
      schema:
        maxLength: 256
        pattern: ^version=1; kind=(rate|cost|quota|concurrency|entitlement|overload|availability); scope=(principal|peer|upstream|workspace|session|service); policy=[a-z]+(?:[._][a-z]+)*; unit=(request|query|byte|connection|credit)(?:; cost=[1-9][0-9]*)?(?:; limit=[1-9][0-9]*; remaining=[0-9]+)?(?:; reset=[0-9]+)?$
        type: string
    AssignRequestID:
      description: Assign-Request-ID on every response; X-Request-ID is its correlation alias.
      schema:
        minLength: 1
        type: string
    AssignServerVersion:
      description: Assign-Server-Version diagnostic, independent artifact version.
      schema:
        minLength: 1
        type: string
    CacheControlNoStore:
      description: Prevents storage of error responses by clients and intermediaries.
      schema:
        const: no-store
        type: string
    CanonicalETag:
      description: Strong opaque validator for exact selected representation, encoding and schema epoch. Does not validate an older epoch or another resource.
      schema:
        pattern: ^"[!#-~\x80-\xff]*"$
        type: string
    ContentTypeOptions:
      description: Prevents user agents from MIME-sniffing the response.
      schema:
        const: nosniff
        type: string
    ETag:
      description: Quoted decimal optimistic-concurrency version.
      schema:
        pattern: ^"[1-9][0-9]*"$
        type: string
    RequestId:
      description: Correlation identifier for the request.
      schema:
        maxLength: 200
        minLength: 1
        type: string
    RetryAfter:
      description: Retry-After delay-seconds or HTTP-date; honor within the caller deadline.
      schema:
        minLength: 1
        type: string
    WWWAuthenticate:
      description: Applicable bearer challenge on product authentication failures.
      schema:
        minLength: 1
        type: string
  parameters:
    CommentId:
      in: path
      name: comment_id
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    CommentReaction:
      in: path
      name: reaction
      required: true
      schema:
        $ref: "#/components/schemas/CommentReactionKey"
    Cursor:
      description: Opaque continuation cursor returned by the preceding page.
      in: query
      name: cursor
      required: false
      schema:
        $ref: "#/components/schemas/Cursor"
    IdempotencyKey:
      description: Opaque client-generated key for safely retrying this operation.
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 200
        minLength: 16
        type: string
    PageLimit:
      description: Maximum number of resources to return.
      in: query
      name: limit
      required: false
      schema:
        default: 50
        maximum: 100
        minimum: 1
        type: integer
    ProjectId:
      in: path
      name: project_id
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    TaskId:
      in: path
      name: task_id
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    WorkspaceId:
      in: path
      name: workspace_id
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The request is malformed or fails validation.
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The mutation conflicts with current resource state or idempotency history.
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    DocumentSchemaUnsupported:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "document_schema_version_unsupported: the client cannot write the current resource schema, or the mutation attempts to downgrade a schema 2 resource. Update to a client supporting schema 2 before retrying."
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The request is forbidden.
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    InternalServerError:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The server could not complete the request.
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    MaintenanceUnavailable:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: |
        Scheduled maintenance temporarily prevents this operation. The standard
        Problem Details response has reason `maintenance_offline` when the service is
        unavailable. Mutating operations may instead return
        `maintenance_read_only` while reads remain available. Clients must
        treat both reasons as retryable availability states, not authorization
        failures, and honor `Retry-After` when present.
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Retry-After:
          description: Delay in seconds before retrying, when an expected maintenance end is known.
          schema:
            minimum: 0
            type: integer
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    NotAcceptableProblem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/NotAcceptableProblem"
      description: Representation not acceptable
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Deadline-Ms:
          $ref: "#/components/headers/AssignDeadlineMs"
        Assign-Limit:
          $ref: "#/components/headers/AssignLimit"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          schema:
            enum:
              - no-store
            type: string
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The resource does not exist or is not visible to this principal.
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    PayloadTooLarge:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: |
        The request body exceeds the limit for this field or operation.
        Document JSON is capped at 2 MiB, a single comment at 256 KiB, and a
        generic JSON request at 1 MiB.
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    PreconditionFailedProblem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PreconditionFailedProblem"
      description: Precondition failed
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Deadline-Ms:
          $ref: "#/components/headers/AssignDeadlineMs"
        Assign-Limit:
          $ref: "#/components/headers/AssignLimit"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          schema:
            enum:
              - no-store
            type: string
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    PreconditionRequiredProblem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PreconditionRequiredProblem"
      description: Precondition required
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Deadline-Ms:
          $ref: "#/components/headers/AssignDeadlineMs"
        Assign-Limit:
          $ref: "#/components/headers/AssignLimit"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          schema:
            enum:
              - no-store
            type: string
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    ProductProblem:
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/MalformedRequestProblem"
              - $ref: "#/components/schemas/UnauthenticatedProblem"
              - $ref: "#/components/schemas/PaymentRequiredProblem"
              - $ref: "#/components/schemas/ForbiddenProblem"
              - $ref: "#/components/schemas/NotFoundProblem"
              - $ref: "#/components/schemas/MethodNotAllowedProblem"
              - $ref: "#/components/schemas/NotAcceptableProblem"
              - $ref: "#/components/schemas/ConflictProblem"
              - $ref: "#/components/schemas/IdempotencyKeyConflictProblem"
              - $ref: "#/components/schemas/OperationInProgressProblem"
              - $ref: "#/components/schemas/GoneProblem"
              - $ref: "#/components/schemas/PreconditionFailedProblem"
              - $ref: "#/components/schemas/ContentTooLargeProblem"
              - $ref: "#/components/schemas/UnsupportedMediaTypeProblem"
              - $ref: "#/components/schemas/ValidationFailedProblem"
              - $ref: "#/components/schemas/LockedProblem"
              - $ref: "#/components/schemas/PreconditionRequiredProblem"
              - $ref: "#/components/schemas/RateLimitedProblem"
              - $ref: "#/components/schemas/InternalErrorProblem"
              - $ref: "#/components/schemas/NotImplementedProblem"
              - $ref: "#/components/schemas/BadGatewayProblem"
              - $ref: "#/components/schemas/ServiceUnavailableProblem"
              - $ref: "#/components/schemas/GatewayTimeoutProblem"
      description: An HTTP admission, validation, domain or availability failure. The status and code select a catalog entry. Errors use no-store; 401 includes WWW-Authenticate, 405 includes Allow, and 429/503 include Retry-After. Stream errors use this response only before the stream is committed.
      headers:
        Allow:
          schema:
            minLength: 1
            type: string
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Deadline-Ms:
          $ref: "#/components/headers/AssignDeadlineMs"
        Assign-Limit:
          $ref: "#/components/headers/AssignLimit"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          schema:
            enum:
              - no-store
            type: string
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The caller has exceeded an applicable abuse-control limit.
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Retry-After:
          description: Seconds until the client may retry.
          schema:
            minimum: 1
            type: integer
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Authentication is missing, invalid, expired, or revoked.
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    UnprocessableEntity:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The request is syntactically valid but violates a domain invariant.
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
    UnsupportedMediaTypeProblem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/UnsupportedMediaTypeProblem"
      description: Unsupported media type
      headers:
        Assign-API-Version:
          $ref: "#/components/headers/AssignAPIVersion"
        Assign-Deadline-Ms:
          $ref: "#/components/headers/AssignDeadlineMs"
        Assign-Limit:
          $ref: "#/components/headers/AssignLimit"
        Assign-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
        Assign-Server-Version:
          $ref: "#/components/headers/AssignServerVersion"
        Cache-Control:
          schema:
            enum:
              - no-store
            type: string
        X-Request-ID:
          $ref: "#/components/headers/AssignRequestID"
  schemas:
    ActivityGroupActor:
      additionalProperties: false
      properties:
        automation:
          type: boolean
        display_name:
          maxLength: 400
          type: string
        id:
          format: uuid
          type:
            - string
            - "null"
        identity_state:
          maxLength: 128
          type: string
        profile_link:
          maxLength: 1024
          type:
            - string
            - "null"
      required:
        - id
        - display_name
        - automation
        - profile_link
        - identity_state
      type: object
    ActivityGroupChildPage:
      additionalProperties: false
      properties:
        counts:
          $ref: "#/components/schemas/ActivityGroupCounts"
        coverage:
          $ref: "#/components/schemas/ActivityGroupCoverage"
        group_id:
          maxLength: 192
          type: string
        group_revision:
          maxLength: 128
          type: string
        has_more:
          type: boolean
        items:
          items:
            $ref: "#/components/schemas/ActivityGroupChildView"
          maxItems: 25
          type: array
        next_cursor:
          maxLength: 4096
          type:
            - string
            - "null"
        observed_at:
          format: date-time
          type: string
        policy_version:
          maxLength: 128
          type: string
        previews:
          items:
            $ref: "#/components/schemas/ActivityGroupPreview"
          maxItems: 150
          type: array
        schema:
          enum:
            - assign.activity.children.v1
          maxLength: 128
          type: string
        snapshot:
          maxLength: 4096
          type: string
        snapshot_id:
          maxLength: 128
          type: string
      required:
        - snapshot_id
        - schema
        - policy_version
        - group_id
        - group_revision
        - snapshot
        - observed_at
        - items
        - counts
        - coverage
        - has_more
        - next_cursor
        - previews
      type: object
    ActivityGroupChildSection:
      additionalProperties: false
      properties:
        continues_after:
          type: boolean
        continues_before:
          type: boolean
        first_occurred_at:
          format: date-time
          type: string
        id:
          maxLength: 128
          type: string
        last_occurred_at:
          format: date-time
          type: string
        project_reference:
          anyOf:
            - $ref: "#/components/schemas/ActivityGroupReference"
            - type: "null"
      required:
        - id
        - first_occurred_at
        - last_occurred_at
        - continues_before
        - continues_after
        - project_reference
      type: object
    ActivityGroupChildView:
      additionalProperties: false
      properties:
        actor:
          $ref: "#/components/schemas/ActivityGroupActor"
        counts:
          $ref: "#/components/schemas/ActivityGroupCounts"
        facts:
          items:
            $ref: "#/components/schemas/ActivityGroupFact"
          maxItems: 16
          type: array
        first_occurred_at:
          format: date-time
          type: string
        id:
          maxLength: 128
          type: string
        last_occurred_at:
          format: date-time
          type: string
        occurred_at:
          format: date-time
          type: string
        operation_id:
          format: uuid
          type:
            - string
            - "null"
        outcome:
          maxLength: 128
          type: string
        parent_id:
          maxLength: 128
          type:
            - string
            - "null"
        preview_keys:
          items:
            maxLength: 4096
            type: string
          maxItems: 3
          type: array
        provenance:
          anyOf:
            - $ref: "#/components/schemas/ActivityGroupProvenance"
            - type: "null"
        references:
          items:
            $ref: "#/components/schemas/ActivityGroupReference"
          maxItems: 8
          type: array
        revision:
          maxLength: 128
          type: string
        section:
          $ref: "#/components/schemas/ActivityGroupChildSection"
      required:
        - parent_id
        - id
        - revision
        - occurred_at
        - first_occurred_at
        - last_occurred_at
        - outcome
        - operation_id
        - actor
        - provenance
        - facts
        - references
        - counts
        - preview_keys
        - section
      type: object
    ActivityGroupChildrenOptions:
      additionalProperties: false
      properties:
        activity_types:
          items:
            enum:
              - tasks
              - comments
              - documents
              - projects
              - milestones
              - development
              - files
              - members
            type: string
          maxItems: 50
          type: array
        actor_ids:
          items:
            format: uuid
            type: string
          maxItems: 50
          type: array
        before_day:
          format: date
          maxLength: 10
          type: string
        cursor:
          maxLength: 4096
          type: string
        day:
          format: date
          maxLength: 10
          type: string
        from_day:
          format: date
          maxLength: 10
          type: string
        group_id:
          maxLength: 192
          type: string
        group_revision:
          maxLength: 128
          type: string
        include_previews:
          default: true
          type: boolean
        limit:
          default: 25
          maximum: 25
          minimum: 1
          type: integer
        project_ids:
          items:
            format: uuid
            type: string
          maxItems: 50
          type: array
        resource_id:
          format: uuid
          type: string
        scope:
          enum:
            - workspace
            - account
            - person
            - project
            - task
          type: string
        snapshot:
          maxLength: 4096
          type: string
        time_zone:
          maxLength: 128
          type: string
      required:
        - scope
        - group_id
        - group_revision
        - snapshot
      type: object
    ActivityGroupCollectionCounts:
      additionalProperties: false
      properties:
        distinct_resources:
          $ref: "#/components/schemas/ActivityGroupCount"
        groups:
          $ref: "#/components/schemas/ActivityGroupCount"
        occurrences:
          $ref: "#/components/schemas/ActivityGroupCount"
        projects:
          $ref: "#/components/schemas/ActivityGroupCount"
      required:
        - projects
        - groups
        - distinct_resources
        - occurrences
      type: object
    ActivityGroupCount:
      additionalProperties: false
      properties:
        accuracy:
          enum:
            - exact
            - lower_bound
            - unknown
          maxLength: 128
          type: string
        resource_kind:
          maxLength: 128
          type: string
        value:
          format: int64
          minimum: 0
          type:
            - integer
            - "null"
      required:
        - value
        - accuracy
        - resource_kind
      type: object
    ActivityGroupCounts:
      additionalProperties: false
      properties:
        children:
          $ref: "#/components/schemas/ActivityGroupCount"
        distinct_resources:
          $ref: "#/components/schemas/ActivityGroupCount"
        occurrences:
          $ref: "#/components/schemas/ActivityGroupCount"
        projects:
          $ref: "#/components/schemas/ActivityGroupCount"
      required:
        - projects
        - distinct_resources
        - occurrences
        - children
      type: object
    ActivityGroupCoverage:
      additionalProperties: false
      properties:
        history_before_retention:
          enum:
            - unknown
          maxLength: 128
          type: string
        reasons:
          items:
            maxLength: 4096
            type: string
          maxItems: 50
          type: array
        retained_days:
          enum:
            - 90
          type: integer
        retained_from:
          format: date-time
          type: string
        status:
          enum:
            - complete
            - partial
            - stale
          maxLength: 128
          type: string
      required:
        - status
        - reasons
        - retained_days
        - retained_from
        - history_before_retention
      type: object
    ActivityGroupExpansion:
      additionalProperties: false
      properties:
        available:
          type: boolean
        coverage:
