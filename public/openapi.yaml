    ProjectKey:
      description: |
        Uppercase-normalized ticket prefix used to form human-readable Task
        references (for example `ASSIGN-42`). Unique per Workspace and
        immutable after creation; not a substitute for the opaque `id`.
      examples:
        - ASSIGN
      pattern: ^[A-Z][A-Z0-9]{1,7}$
      type: string
    ProjectPermissions:
      additionalProperties: false
      properties:
        can_manage_members:
          type: boolean
        can_publish:
          type: boolean
        can_update:
          type: boolean
      required:
        - can_update
        - can_publish
        - can_manage_members
      type: object
    ProjectVisibility:
      description: Private Projects require explicit Project membership except for governed Workspace owner/admin access. Public affects only the sanitized anonymous projection; authenticated access remains policy-checked.
      enum:
        - workspace
        - private
        - public
      type: string
    ProjectVisualIdentity:
      description: A single allowlisted Lucide icon name or fully-qualified Unicode Emoji 17.0 sequence.
      oneOf:
        - $ref: "#/components/schemas/ProjectIconVisualIdentity"
        - $ref: "#/components/schemas/ProjectEmojiVisualIdentity"
    PublicUsername:
      description: Globally unique mutable public account handle. New handles use lowercase letters, numbers, and interior dots and are initially derived from the email local part. Existing hyphen/underscore handles remain readable. Previously claimed values remain reserved to the same User.
      examples:
        - jane.doe
      maxLength: 30
      minLength: 3
      pattern: ^[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?$
      type: string
    RateLimitedProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - properties:
            code:
              const: rate_limited
            retryable:
              const: true
            status:
              const: 429
            type:
              const: https://docs.assign.so/errors/rate_limited
          type: object
    ReferenceOption:
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        label:
          maxLength: 500
          minLength: 1
          type: string
        secondary_label:
          oneOf:
            - maxLength: 500
              minLength: 1
              type: string
            - type: "null"
        type:
          $ref: "#/components/schemas/ReferenceOptionType"
        uri:
          description: Deployment-independent reference URI stored by the editor.
          pattern: ^assign:(user|agent|document|project|task)/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          type: string
      required:
        - type
        - id
        - label
        - uri
      type: object
    ReferenceOptionList:
      additionalProperties: false
      properties:
        agents:
          items:
            $ref: "#/components/schemas/ReferenceOption"
          maxItems: 20
          type: array
        documents:
          items:
            $ref: "#/components/schemas/ReferenceOption"
          maxItems: 20
          type: array
        projects:
          items:
            $ref: "#/components/schemas/ReferenceOption"
          maxItems: 20
          type: array
        tasks:
          items:
            $ref: "#/components/schemas/ReferenceOption"
          maxItems: 20
          type: array
        users:
          items:
            $ref: "#/components/schemas/ReferenceOption"
          maxItems: 20
          type: array
      required:
        - users
        - agents
        - documents
        - projects
        - tasks
      type: object
    ReferenceOptionType:
      enum:
        - user
        - agent
        - document
        - project
        - task
      type: string
    ResolvedLifecycle:
      additionalProperties: false
      description: |
        Materialized lifecycle policy of the entity's current status. Compare
        `stage_revision` and `definition_revision` for staleness; `behaviors`
        is the complete set for the entity kind, so clients never infer policy
        from names or categories. Absent when the selection has no lifecycle
        status. Project list
        rows carry identities and revisions only: `stage_name` and `behaviors`
        are omitted there and returned by Project detail and the lifecycle
        definition list.
      properties:
        behaviors:
          additionalProperties:
            type: boolean
          type: object
        definition_id:
          $ref: "#/components/schemas/Identifier"
        definition_revision:
          minimum: 1
          type: integer
        stage_id:
          $ref: "#/components/schemas/Identifier"
        stage_name:
          type: string
        stage_revision:
          minimum: 1
          type: integer
      required:
        - stage_id
        - stage_revision
        - definition_id
        - definition_revision
      type: object
    ReversibleCommand:
      additionalProperties: false
      properties:
        created_at:
          $ref: "#/components/schemas/Timestamp"
        description:
          maxLength: 500
          minLength: 1
          type: string
        entity_id:
          $ref: "#/components/schemas/Identifier"
        entity_type:
          enum:
            - task
          type: string
        id:
          $ref: "#/components/schemas/Identifier"
        state:
          enum:
            - done
            - undone
          type: string
        type:
          pattern: ^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+$
          type: string
        undo_description:
          maxLength: 500
          minLength: 1
          type: string
        undoable_until:
          $ref: "#/components/schemas/Timestamp"
      required:
        - id
        - type
        - entity_type
        - entity_id
        - description
        - undo_description
        - state
        - undoable_until
        - created_at
      type: object
    RichTextDocument:
      description: |
        Versioned, server-validated rich-text document. The server accepts
        only nodes and marks on the Assign allowlist and rejects anything
        outside it; the client's installed editor extension set is never
        authoritative. Complexity is bounded at 32 levels of nesting and
        50,000 nodes in addition to the per-field byte limits.

        Accepted nodes: `doc`, `paragraph`, `text`, `heading`, `bulletList`,
        `orderedList`, `listItem`, `taskList`, `taskItem`, `blockquote`, `callout`,
        `codeBlock`, `blockMath`, `horizontalRule`, `hardBreak`, `image`, `file`, plus the
        reference nodes `userMention`, `projectReference`, `documentReference`,
        and `taskReference`. Accepted marks: `bold`, `italic`, `underline`,
        `strike`, `code`, `link`.

        A Task-description or Comment mutation accepts at most 100 distinct
        canonical user identifiers across its `userMention` nodes. Repeated
        mentions of the same user count once.

        `image` and `file` name an Assign attachment through
        `attrs.attachmentId` and carry no URL and no bytes: attachments travel
        only through the attachment upload and download operations, and a
        signed URL is minted per request after a fresh authorization check
        rather than stored in content. A request whose `image` or `file` node
        omits `attachmentId`, or carries a URL-bearing attribute, is rejected.

        `callout` has block children and exactly `attrs.kind` and `attrs.icon`.
        Kind is `callout`, `note`, `tip`, `important`, `warning`, or `caution`.
        Icon is null for the default Lucide icon, an emoji of at most 64 UTF-8
        bytes, an allowlisted `lucide:name` token to override it, or an empty string
        to hide it. Unknown Lucide names are rejected. HTML, URLs and image
        data are not accepted as icons. Callouts are additive in schemas 1 and 2.

        `blockMath` stores a required string `attrs.latex`; rendered math HTML
        and renderer settings are not persisted. Schema 1 retains the existing node contract; schema 2 additionally admits tables.
        Checklists, attachment blocks, display equations, `underline`, and
        `projectReference` were added additively, so every
        previously stored document is still valid and no migration is
        required.

        Schema 2 additionally accepts table, tableRow, tableCell and tableHeader.
        A table has tableRow children; a row has tableCell/tableHeader children.
        Cells contain Assign blocks, starting with a paragraph; nested tables
        are rejected. Cells accept colspan/rowspan (integers 1–64, default 1),
        colwidth (null or one integer 24–2000 per spanned column), and align
        (null, left, center or right). Tables/rows have no attrs, marks or text;
        cells have no marks/text or other attributes. The occupancy grid must
        be rectangular with no overlap, holes or spans beyond its rows.
        Limits are 1000 rows, 64 logical columns and 10000 physical cells,
        still subject to each field's byte budget and global node/depth limits.
        Schema 1 rejects all four table nodes. Rich tables exchange through the
        named assign-table Markdown JSON fence; simple tables use GFM pipes.
      examples:
        - content: []
          schema_version: 1
          type: doc
      properties:
        content:
          description: Allowlisted block nodes.
          items:
            type: object
          type: array
        schema_version:
          description: Server-validated schema version. Schema 2 table resources cannot be downgraded to schema 1.
          enum:
            - 1
            - 2
          type: integer
        type:
          const: doc
          type: string
      required:
        - schema_version
        - type
        - content
      type: object
    Role:
      description: |
        `viewer` reads the Workspace and its work and writes nothing. `admin`
        holds the same capabilities as `owner`; the only owner-reserved
        operation is archiving the Workspace, and a Workspace must always
        retain at least one active owner.
      enum:
        - owner
        - admin
        - member
        - viewer
      type: string
    SearchResourceType:
      description: Resource types available from Workspace search. `person` is an active Workspace-membership projection and has no email field.
      enum:
        - project
        - task
        - document
        - comment
        - person
      type: string
    SearchResult:
      additionalProperties: false
      properties:
        identifier:
          description: Canonical ticket reference for Tasks and Comments, Project code, or Document path. Available independently of client collection loading.
          type: string
        project_code:
          description: Recognizable parent Project code.
          type: string
        project_id:
          description: Parent Project for a Task, Document, or Comment result; `null` for a Project result.
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        project_path:
          description: Canonical Project path for navigation and parent context.
          type: string
        resource_id:
          $ref: "#/components/schemas/Identifier"
        resource_type:
          $ref: "#/components/schemas/SearchResourceType"
        snippet:
          description: Bounded plain-text context from the indexed content. Treat as text, not HTML.
          maxLength: 240
          type: string
        status_category:
          oneOf:
            - $ref: "#/components/schemas/StatusCategory"
            - type: "null"
        status_color:
          oneOf:
            - pattern: ^#[0-9A-Fa-f]{6}$
              type: string
            - type: "null"
        status_icon:
          oneOf:
            - pattern: ^[a-z][a-z0-9-]{0,63}$
              type: string
            - type: "null"
        status_id:
          description: Current Status for a Task result; null for every other result type.
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        status_label:
          oneOf:
            - maxLength: 100
              minLength: 1
              type: string
            - type: "null"
        status_type:
          oneOf:
            - $ref: "#/components/schemas/StatusType"
            - type: "null"
        subtitle:
          description: Workspace-safe supporting text. Person results contain the Workspace role.
          maxLength: 100
          type: string
        task_id:
          description: Parent Task for a Comment result; `null` otherwise.
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        title:
          maxLength: 128
          minLength: 1
          type: string
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      required:
        - resource_type
        - resource_id
        - project_id
        - task_id
        - status_id
        - status_label
        - status_category
        - status_type
        - status_icon
        - status_color
        - title
        - snippet
        - updated_at
      type: object
    SearchResultList:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/SearchResult"
          maxItems: 50
          type: array
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
        result_version:
          description: Opaque version of the first 20 unfiltered non-archived work results, scoped to query and current member. Absent for other filters/page sizes/cursors. Does not include People or prove exhaustive coverage.
          pattern: ^[a-f0-9]{64}$
          type: string
      required:
        - data
        - has_more
        - next_cursor
      type: object
    ServiceUnavailableProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - properties:
            code:
              const: service_unavailable
            retryable:
              const: true
            status:
              const: 503
            type:
              const: https://docs.assign.so/errors/service_unavailable
          type: object
    StatusCategory:
      enum:
        - backlog
        - todo
        - in_progress
        - in_review
        - done
      type: string
    StatusType:
      description: Canonical lifecycle meaning. Custom labels remain presentation; completed and cancelled are terminal.
      enum:
        - backlog
        - unstarted
        - started
        - completed
        - cancelled
      type: string
    Task:
      additionalProperties: false
      properties:
        archived_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        assignee_actor_id:
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        code:
          $ref: "#/components/schemas/TaskCode"
        completed_at:
          description: Server-written instant when the Task last entered a done-category Status; null while open or when no completion timestamp is available.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        description:
          oneOf:
            - $ref: "#/components/schemas/RichTextDocument"
            - type: "null"
        due_on:
          oneOf:
            - format: date
              type: string
            - type: "null"
        id:
          $ref: "#/components/schemas/Identifier"
        label_ids:
          description: Task collections include the complete assignment identifier set; an empty array means no labels. Non-collection responses may omit this field; use the target-label read when absent.
          items:
            $ref: "#/components/schemas/Identifier"
          maxItems: 20
          type: array
        lifecycle:
          enum:
            - active
            - archived
            - trashed
            - purged
          type: string
        milestone_id:
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        project_id:
          $ref: "#/components/schemas/Identifier"
        purge_after:
          description: Fixed retention deadline after which Task content may be redacted; null outside trash and after purge.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        purged_at:
          description: Tombstone creation instant. A purged Task retains only stable reference metadata and cannot be restored.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        rank:
          description: Server-owned sortable order key within the Task's Project and Status. Clients render it but submit neighbour anchors when moving a Task.
          minLength: 1
          type: string
        resolution:
          description: Terminal outcome for the current resolved episode; null for active Tasks.
          oneOf:
            - $ref: "#/components/schemas/TaskResolution"
            - type: "null"
        resolved_at:
          description: Instant the current terminal episode began; cleared when the Task becomes active again.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        resolved_by:
          description: Actor that started the current terminal episode; null when historical or automated provenance is unavailable.
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        reversible_command:
          $ref: "#/components/schemas/ReversibleCommand"
          description: Present only on a mutation response when the server created an undoable command. Read responses omit it.
        revision:
          minimum: 1
          type: integer
        status_id:
          $ref: "#/components/schemas/Identifier"
        status_lifecycle:
          $ref: "#/components/schemas/ResolvedLifecycle"
        summary:
          description: Revision-bound derived convenience text. It is null when the body is shorter than 300 normalized characters, generation is pending, or the stored projection is stale. It is never evidence or a replacement for description content.
          oneOf:
            - $ref: "#/components/schemas/GeneratedResourceSummary"
            - type: "null"
        task_number:
          minimum: 1
          type: integer
        title:
          maxLength: 128
          minLength: 1
          type: string
        trashed_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        workspace_id:
          $ref: "#/components/schemas/Identifier"
      required:
        - id
        - workspace_id
        - project_id
        - task_number
        - code
        - status_id
        - rank
        - title
        - priority
        - revision
        - created_at
        - updated_at
        - archived_at
        - trashed_at
        - purge_after
        - purged_at
        - lifecycle
        - resolved_at
        - resolved_by
        - resolution
        - summary
      type: object
    TaskCode:
      description: |
        Case-insensitive client input normalized to uppercase by the server.
        Exactly the UI ticket reference `{PROJECT_KEY}-{TASK_NUMBER}` (for
        example `PRO-123`); the positive Task number is canonical decimal
        without leading zeroes.
      maxLength: 28
      minLength: 4
      pattern: ^[A-Z][A-Z0-9]{1,7}-[1-9][0-9]{0,18}$
      type: string
    TaskCreateRequest:
      additionalProperties: false
      not:
        required:
          - description
          - description_markdown
      properties:
        assignee_actor_id:
          $ref: "#/components/schemas/Identifier"
          description: Omit to use the Workspace's default Task assignee policy.
        description:
          $ref: "#/components/schemas/RichTextDocument"
        description_markdown:
          description: Task description as Markdown. Mutually exclusive with description; the 2 MiB UTF-8 and canonical rich-text content limits also apply.
          maxLength: 2097152
          type: string
        due_on:
          format: date
          type: string
        milestone_id:
          $ref: "#/components/schemas/Identifier"
        priority:
          $ref: "#/components/schemas/TaskPriority"
          description: Omit to use the Workspace's default Task priority.
        status_id:
          $ref: "#/components/schemas/Identifier"
          description: Omit to use the Workspace's default Task workflow category.
        title:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - title
      type: object
    TaskPriority:
      enum:
        - none
        - low
        - medium
        - high
        - urgent
      type: string
    TaskResolution:
      description: Current terminal outcome, independent from the custom Status label.
      enum:
        - completed
        - cancelled
      type: string
    TaskUpdateRequest:
      additionalProperties: false
      description: Every field is optional; an omitted field keeps its current value. Moving to another Project requires a Status that applies to that Project and clears the Project-scoped milestone.
      properties:
        assignee_actor_id:
          description: An explicit null clears the assignee.
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        description:
          oneOf:
            - $ref: "#/components/schemas/RichTextDocument"
            - type: "null"
        due_on:
          oneOf:
            - format: date
              type: string
            - type: "null"
        milestone_id:
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        project_id:
          $ref: "#/components/schemas/Identifier"
        status_id:
          $ref: "#/components/schemas/Identifier"
        title:
          maxLength: 128
          minLength: 1
          type: string
      type: object
    Timestamp:
      description: RFC 3339 timestamp in UTC.
      examples:
        - 2026-08-15T12:00:00Z
      format: date-time
      type: string
    UnauthenticatedProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - properties:
            code:
              const: unauthenticated
            retryable:
              const: false
            status:
              const: 401
            type:
              const: https://docs.assign.so/errors/unauthenticated
          type: object
    UnsupportedMediaTypeProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - properties:
            code:
              const: unsupported_media_type
            retryable:
              const: false
            status:
              const: 415
            type:
              const: https://docs.assign.so/errors/unsupported_media_type
          type: object
    ValidationFailedProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - properties:
            code:
              const: validation_failed
            retryable:
              const: false
            status:
              const: 422
            type:
              const: https://docs.assign.so/errors/validation_failed
          type: object
    WorkspaceRef:
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug
      type: object
  securitySchemes:
    bearerToken:
      bearerFormat: Assign access token
      description: |
        A revocable, scoped access token issued for non-interactive clients.
        The token is audience-bound to the HTTPS API host; clients must not
        send it to another host or place it in a URL. Discuss operations
        additionally require the dedicated `assign:discuss` scope.
      scheme: bearer
      type: http
info:
  description: Public HTTP API for Assign. The document release is independent from server, client, SDK, realtime, and MCP releases.
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Assign API
  version: 1.0.0-rc.10
openapi: 3.1.1
paths:
  /api/v1/comments/{comment_id}:
    delete:
      description: Deletes Comment content when the calling Actor has author or moderation permission, retaining its identity, author, timestamps and creation-order ordinal as a tombstone. Send the opaque If-Match from getComment for the selected encoding. A missing condition returns 428 and a stale condition returns 412. Retain the original Idempotency-Key and condition after uncertainty to recover the same bodyless result. The command-result validator is not an item write validator.
      operationId: deleteComment
      parameters:
        - $ref: "#/components/parameters/CommentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - description: Opaque validator from this exact current authorized Comment item and encoding. Retain unchanged with the original key after uncertainty.
          in: header
          name: If-Match
          required: true
          schema:
            maxLength: 16384
            minLength: 1
            type: string
      responses:
        "204":
          description: The comment is deleted. Repeating the request succeeds unchanged.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Vary:
              description: Selected representation varies with Accept and Accept-Encoding.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ProductProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/ProductProblem"
        "409":
          $ref: "#/components/responses/ProductProblem"
        "412":
          $ref: "#/components/responses/ProductProblem"
        "413":
          $ref: "#/components/responses/ProductProblem"
        "415":
          $ref: "#/components/responses/ProductProblem"
        "422":
          $ref: "#/components/responses/ProductProblem"
        "428":
          $ref: "#/components/responses/ProductProblem"
        "429":
          $ref: "#/components/responses/ProductProblem"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/MaintenanceUnavailable"
        default:
          $ref: "#/components/responses/ProductProblem"
      security:
        - bearerToken: []
      summary: Delete a comment
      tags:
        - Comments
    get:
      description: Reads a Comment or its deletion tombstone after checking current Task access. Deleted content is not returned. Use the exact opaque ETag from this item and encoding for an update or delete; do not construct it from revision or reuse a collection or command-result tag. If-None-Match may return bodyless 304 after authorization. JSON supports identity or gzip with distinct validators.
      operationId: getComment
      parameters:
        - description: Include the canonical body_markdown representation without changing resource identity. Preserve this selection when recovering an uncertain write.
          in: query
          name: format
          required: false
          schema:
            enum:
              - markdown
            type: string
        - $ref: "#/components/parameters/CommentId"
        - in: header
          name: If-None-Match
          required: false
          schema:
            maxLength: 16384
            type: string
        - description: Opaque entity-tag list or wildcard. A supplied strong condition must match the currently authorized representation; otherwise 412.
          in: header
          name: If-Match
          schema:
            maxLength: 8192
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalCommentRead"
          description: The comment, or its tombstone if it was deleted.
          headers:
            Cache-Control:
              schema:
                const: private, no-store
                type: string
            Content-Encoding:
              description: Present only when the selected response uses gzip.
              schema:
                enum:
                  - gzip
                type: string
            Content-Length:
              description: Length of the selected encoded response in bytes.
              schema:
                minimum: 0
                type: integer
            ETag:
              $ref: "#/components/headers/CanonicalETag"
            Vary:
              description: Includes Accept and Accept-Encoding.
              schema:
                type: string
        "304":
          description: Current authority checked; exact representation reused without a body.
          headers:
            Cache-Control:
              schema:
                const: private, no-store
                type: string
            ETag:
              $ref: "#/components/headers/CanonicalETag"
            Vary:
              description: Includes Accept and Accept-Encoding.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ProductProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProductProblem"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/ProductProblem"
        "409":
          $ref: "#/components/responses/ProductProblem"
        "412":
          $ref: "#/components/responses/ProductProblem"
        "413":
          $ref: "#/components/responses/ProductProblem"
        "415":
          $ref: "#/components/responses/ProductProblem"
        "422":
          $ref: "#/components/responses/ProductProblem"
        "428":
          $ref: "#/components/responses/ProductProblem"
        "429":
          $ref: "#/components/responses/ProductProblem"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/MaintenanceUnavailable"
        default:
          $ref: "#/components/responses/ProductProblem"
      security:
        - bearerToken: []
      summary: Read a comment
      tags:
        - Comments
    patch:
      description: Replaces the body of a live Comment when the calling Actor has edit permission. The body accepts the declared rich-text JSON or UTF-8 text/markdown, subject to the same 256 KiB canonical content limit. Send the opaque If-Match from getComment for the selected encoding. A missing condition returns 428 and a stale condition returns 412. Retain the original key, body and condition after uncertainty to recover the committed result. The first edit sets edited_at; earlier bodies are not exposed as version history. Read the item again for the next write validator.
      operationId: updateComment
      parameters:
        - description: Include the canonical body_markdown representation without changing resource identity. Preserve this selection when recovering an uncertain write.
          in: query
          name: format
          required: false
          schema:
            enum:
              - markdown
            type: string
        - $ref: "#/components/parameters/CommentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - description: Opaque validator from this exact current authorized Comment item and encoding. Retain unchanged with the original key after uncertainty.
          in: header
          name: If-Match
          required: true
          schema:
            maxLength: 16384
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanonicalCommentBodyRequest"
          text/markdown:
            schema:
              description: UTF-8 Markdown converted by the existing canonical codec and validated under the same comment policy and byte limits before a single effect.
              maxLength: 262144
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalCommentRead"
          description: The edited comment.
          headers:
            Cache-Control:
              description: Response is not cacheable.
              schema:
                type: string
            Content-Encoding:
              description: Present only when the selected response uses gzip.
              schema:
                enum:
                  - gzip
                type: string
            Content-Length:
              description: Length of the selected encoded response in bytes.
              schema:
                minimum: 0
                type: integer
            Vary:
              description: Selected representation varies with Accept and Accept-Encoding.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/ProductProblem"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/ProductProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/ProductProblem"
        "422":
          $ref: "#/components/responses/ProductProblem"
        "428":
          $ref: "#/components/responses/ProductProblem"
        "429":
          $ref: "#/components/responses/ProductProblem"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/MaintenanceUnavailable"
        default:
          $ref: "#/components/responses/ProductProblem"
      security:
        - bearerToken: []
      summary: Edit a comment
      tags:
        - Comments
  /api/v1/comments/{comment_id}/reactions/{reaction}:
    delete:
      description: Idempotently removes the calling Actor's selected reaction from a live Comment whose parent Task is active. Repeating an absent reaction creates no change. The response contains complete current reaction aggregates. This command accepts no body, Idempotency-Key or body-version condition and does not increment the Comment body revision. Read getComment for an item write validator.
      operationId: removeCommentReaction
      parameters:
        - $ref: "#/components/parameters/CommentId"
        - $ref: "#/components/parameters/CommentReaction"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalCommentRead"
          description: The current Comment with reaction aggregates.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Content-Encoding:
              description: Present only when the selected response uses gzip.
              schema:
                enum:
                  - gzip
                type: string
            Content-Length:
              description: Length of the selected encoded response in bytes.
              schema:
                minimum: 0
                type: integer
            Vary:
              description: Selected representation varies with Accept and Accept-Encoding.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/ProductProblem"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/ProductProblem"
        "413":
          $ref: "#/components/responses/ProductProblem"
        "415":
          $ref: "#/components/responses/ProductProblem"
        "422":
          $ref: "#/components/responses/ProductProblem"
        "428":
          $ref: "#/components/responses/ProductProblem"
        "429":
          $ref: "#/components/responses/ProductProblem"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/MaintenanceUnavailable"
        default:
          $ref: "#/components/responses/ProductProblem"
      security:
        - bearerToken: []
      summary: Remove the caller's reaction from a comment
      tags:
        - Comments
    put:
      description: Idempotently adds the calling Actor's selected reaction to a live Comment whose parent Task is active. Repeating the same reaction creates no duplicate. The response contains complete current reaction aggregates. This command accepts no body, Idempotency-Key or body-version condition and does not increment the Comment body revision. Read getComment for an item write validator.
      operationId: addCommentReaction
      parameters:
        - $ref: "#/components/parameters/CommentId"
        - $ref: "#/components/parameters/CommentReaction"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalCommentRead"
          description: The current Comment with reaction aggregates.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Content-Encoding:
              description: Present only when the selected response uses gzip.
              schema:
                enum:
                  - gzip
                type: string
            Content-Length:
              description: Length of the selected encoded response in bytes.
              schema:
                minimum: 0
                type: integer
            Vary:
              description: Selected representation varies with Accept and Accept-Encoding.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/ProductProblem"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/ProductProblem"
        "413":
          $ref: "#/components/responses/ProductProblem"
        "415":
          $ref: "#/components/responses/ProductProblem"
        "422":
          $ref: "#/components/responses/ProductProblem"
        "428":
          $ref: "#/components/responses/ProductProblem"
        "429":
          $ref: "#/components/responses/ProductProblem"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/MaintenanceUnavailable"
        default:
