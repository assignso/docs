        avatar_color:
          description: Account-owned avatar background color family; null when no override is stored.
          oneOf:
            - $ref: "#/components/schemas/PaletteColor"
            - type: "null"
        avatar_initials:
          description: Account-owned avatar letters override; null derives letters from the display name.
          oneOf:
            - maxLength: 2
              minLength: 1
              type: string
            - type: "null"
        bio:
          oneOf:
            - maxLength: 500
              type: string
            - type: "null"
        date_format:
          enum:
            - locale
            - mdy
            - dmy
            - ymd
          type: string
        display_name:
          type: string
        editor_controls:
          description: Account-wide presentation preference for contextual or always-visible formatting controls across every editor host.
          enum:
            - contextual
            - persistent
          type: string
        email:
          format: email
          type: string
        first_day_of_week:
          enum:
            - sunday
            - monday
          type: string
        first_day_of_week_inherited:
          description: When true, first_day_of_week is the effective value from the current Workspace default.
          type: boolean
        id:
          $ref: "#/components/schemas/Identifier"
        interface_language:
