              minLength: 1
              type: string
            - type: "null"
        author_actor_id:
          $ref: "#/components/schemas/Identifier"
        body:
          description: Absent or null once the comment is deleted.
          oneOf:
            - $ref: "#/components/schemas/CanonicalCommentRichTextDocument"
            - type: "null"
        body_markdown:
          description: Markdown form of the comment, included when format=markdown is requested. Omitted on deleted tombstones, like body.
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
