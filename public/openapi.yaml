        - status_label
        - status_category
        - updated_at
      type: object
    Cursor:
      description: Opaque, endpoint-specific pagination cursor.
      maxLength: 2048
      minLength: 1
      type: string
    EntityTagCondition:
      description: HTTP strong entity-tag list or wildcard. An observed-version operation rejects an unsupported wildcard explicitly. Obtain the opaque tag from the authorized canonical item/encoding read, never from a revision or collection. Missing condition is 428; failed condition is 412. Create-only PUT uses If-None-Match star and collision 412.
      minLength: 1
      pattern: ^[ \t]*(\*|"[!#-~\x80-\xff]*"([ \t]*,[ \t]*"[!#-~\x80-\xff]*")*)[ \t]*$
      type: string
    ErrorResponse:
      $ref: "#/components/schemas/ProblemDetails"
    FieldError:
      additionalProperties: true
      anyOf:
        - required:
            - pointer
        - required:
            - parameter
      properties:
        code:
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        message:
          minLength: 1
          type: string
        parameter:
          minLength: 1
          type: string
        pointer:
          pattern: ^(/([^~/]|~[01])*)*$
          type: string
      required:
        - code
        - message
      type: object
    ForbiddenProblem:
